f7bdbcde7865","isnew":true},{"n":"Площадь Туманяна","lat":55.8648607382,"lon":37.5469565392,"c":["history"],"id":"moscow-v5-5f7062a52ed319","isnew":true},{"n":"Соловьиная роща в Куркино","lat":55.8905715925,"lon":37.4014949799,"c":["nature"],"id":"moscow-v5-a30ea26d6dbbb4","isnew":true},{"n":"Головинский парк","lat":55.8459519205,"lon":37.5078821182,"c":["nature"],"id":"moscow-v5-7d9e3d74bdffea","isnew":true}];const categories=['all','unusual','viewpoints','history','shopping','cafes','nature','entertainment','museums'];const select=document.getElementById('cat');select.innerHTML=categories.map(x=>`<option value="${x}">${x==='all'?'Все категории':x}</option>`).join('');let shown=[];const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');function xy(p){return [(p.lon-36.82)/(38.03-36.82)*canvas.width,(56.05-p.lat)/(56.05-55.1)*canvas.height]}function paint(){let w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.fillStyle='#112c43';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#2e5772';ctx.lineWidth=.5;for(let i=0;i<11;i++){let x=i*w/10,y=i*h/10;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}shown.forEach(p=>{let x=(p.lon-36.82)/(38.03-36.82)*w,y=(56.05-p.lat)/(56.05-55.1)*h;ctx.beginPath();ctx.arc(x,y,p.isnew?3.5:2.1,0,Math.PI*2);ctx.fillStyle=p.isnew?'#f8cb5b':'#a896f9';ctx.fill()})}function apply(){let c=select.value,search=document.getElementById('search').value.trim().toLowerCase(),newOnly=document.getElementById('newOnly').checked;shown=data.filter(p=>(c==='all'||p.c.includes(c))&&(!newOnly||p.isnew)&&p.n.toLowerCase().includes(search));document.getElementById('count').textContent=`Показано ${shown.length} из ${data.length} объектов`;document.getElementById('results').innerHTML=shown.slice(0,120).map(p=>`<div>${p.isnew?'★ ':''}${p.n.replace(/&/g,'&amp;').replace(/</g,'&lt;')} <small>${p.c.join(', ')} · ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}</small></div>`).join('');paint()}for(let id of ['cat','search','newOnly'])document.getElementById(id).addEventListener('input',apply);document.getElementById('reset').onclick=()=>{select.value='all';document.getElementById('search').value='';document.getElementById('newOnly').checked=false;apply()};canvas.addEventListener('click',e=>{let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,best=null;for(let p of shown){let xx=(p.lon-36.82)/(38.03-36.82)*r.width,yy=(56.05-p.lat)/(56.05-55.1)*r.height,d=Math.hypot(xx-x,yy-y);if(!best||d<best.d)best={p,d}}if(best&&best.d<16)document.getElementById('selected').textContent=`${best.p.n}: ${best.p.lat}, ${best.p.lon}`});window.addEventListener('resize',paint);apply();</script></body></html>
