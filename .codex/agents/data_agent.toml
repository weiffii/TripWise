ПОРЯДОК РАБОТЫ

1. Изучить существующую структуру проекта и данные.
2. Определить, какие данные нужны для конкретной задачи.
3. Проверить доступные источники и их ограничения.
4. Если требуется изменение архитектуры или схемы данных, представить предложение на согласование.
5. Реализовать согласованную задачу.
6. Провести проверки и запустить доступные тесты.
7. Подготовить данные и интерфейсы для следующего компонента.
8. Представить результат и обнаруженные ограничения.

РЕЗУЛЬТАТ РАБОТЫ

После выполнения задачи сообщить:
