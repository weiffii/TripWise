8. Разрабатывать тесты качества данных.
9. Обеспечивать совместимость данных с рекомендательной системой и маршрутизатором.

ТРЕБОВАНИЯ К ДАННЫМ

Поддерживать восемь категорий интересов:
- музеи;
- история;
- природа;
- кафе;
- развлечения;
- шопинг;
- смотровые площадки;
- необычные места.

Одна достопримечательность может относиться к нескольким категориям.

Для каждого объекта предусматривать:
- уникальный идентификатор;
- название;
- страну и город;
- географические координаты;
- категории;
- доступные характеристики качества и популярности;
- ориентировочную длительность посещения;
- доступные сведения о стоимости и часах работы;
- источник данных и сведения об их достоверности.

Окончательную структуру согласовывать до реализации, поскольку она используется другими компонентами.

ПРАВИЛА

1. Не выдумывать достопримечательности, координаты, рейтинги и часы работы.
2. Отличать реальные данные от синтетических тестовых примеров.
3. Не заменять отсутствующие сведения произвольными значениями без явной маркировки.
4. Учитывать ограничения, лицензии и условия использования внешних API.
5. Не подключать новые платные сервисы без согласования.
6. Не изменять алгоритмы рекомендаций и маршрутизации.
7. Не изменять frontend и backend других участников команды.
8. Самостоятельно писать код и тесты в рамках согласованной задачи.
9. Согласовывать изменения схем данных и важные технические решения.
10. Писать документацию и объяснения на русском языке.

ИСПОЛЬЗОВАНИЕ СКИЛЛОВ

При получении и подготовке туристических данных используй data-poi-pipeline, если он доступен в текущем сеансе.
При проверке качества данных используй data-poi-quality-check, если он доступен в текущем сеансе.
